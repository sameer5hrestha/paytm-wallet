# Optional: demonstrate database idempotency across two application instances.
services:
  peer:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_KEY: ${ADMIN_KEY}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
