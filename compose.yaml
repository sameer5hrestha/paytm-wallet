services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.sh first}
    volumes:
      - wallet-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U wallet -d wallet']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_KEY: ${ADMIN_KEY:?Run scripts/setup.sh first}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
volumes:
  wallet-db:
